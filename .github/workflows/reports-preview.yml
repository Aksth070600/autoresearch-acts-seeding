name: Preview ACTS report

on:
  pull_request:
    paths:
      - 'records/**'
      - 'orchestration-files/report.py'
      - 'orchestration-files/campaign_status.py'
      - 'orchestration-files/campaign_control.py'
      - 'orchestration-files/campaign_scheduler.py'
      - 'orchestration-files/campaign-status.schema.json'
      - 'orchestration-files/objectives.py'
      - 'orchestration-files/proposal.py'
      - 'orchestration-files/protocol.py'
      - 'orchestration-files/select-evaluation.py'
      - 'orchestration-files/tests/**'
      - 'orchestration-files/visualizations/**'
      - '.github/workflows/reports-preview.yml'
      - '.github/workflows/finish-campaign.yml'
      - 'Makefile'

permissions:
  contents: read

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Run repository tests
        run: python3 -m unittest discover -s orchestration-files/tests -v

      - name: Build interactive report
        run: python3 orchestration-files/report.py --dataset development --output build/site

      - name: Upload interactive report artifact
        uses: actions/upload-artifact@v4
        with:
          name: acts-report-preview-${{ github.event.pull_request.number }}
          path: build/site
          if-no-files-found: error
